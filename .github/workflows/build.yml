name: Build Vitrine IPA (private)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Fetch private IPA parts
        run: git clone --depth 1 https://x-access-token:${{ secrets.IPA_REPO_TOKEN }}@github.com/7asan-mrisat/vitrine-ipa.git ipa-parts

      - name: Assemble IPA
        run: |
          mkdir -p ipa
          cat $(ls ipa-parts/spotify.ipa.part* | sort -V) > ipa/spotify.ipa
          test "$(shasum -a 256 ipa/spotify.ipa | cut -d' ' -f1)" = "409601a58953818eea17edb92963d10256ae6fcf00c69954105e5becc08ec296"

      - run: make release

      - uses: actions/upload-artifact@v5
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error
